services:
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - matcher-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  api:
    build:
      context: .
      args:
        USE_LOCAL: "false"
    command: uvicorn matcher.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file: .env.production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - matcher-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    build:
      context: .
      args:
        USE_LOCAL: "false"
    command: arq matcher.worker.settings.WorkerSettings
    env_file: .env.production
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - matcher-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: matcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: matcher
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matcher"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 3G
    restart: unless-stopped
    networks:
      - matcher-net

  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    networks:
      - matcher-net

  backup:
    build: ./infra/backup
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - matcher-net

  alerter:
    build: ./infra/alerter
    env_file: .env.production
    environment:
      HEALTH_URL: http://nginx/api/v1/health
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - matcher-net

volumes:
  pgdata:
  redisdata:

networks:
  matcher-net:
    driver: bridge
