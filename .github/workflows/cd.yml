name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "${{ secrets.DO_HOST }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::DO_HOST secret not configured — skipping deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SCP
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "."
          target: "/opt/1C"
          rm: false

      - name: Execute Docker Deployment
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /opt/1C
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build --force-recreate api worker nginx
