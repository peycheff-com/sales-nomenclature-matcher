name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/sales-nomenclature-matcher-app:${{ github.sha }}
  NGINX_IMAGE: ghcr.io/${{ github.repository_owner }}/sales-nomenclature-matcher-nginx:${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.APP_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/sales-nomenclature-matcher-app:latest

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/nginx/Dockerfile
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/sales-nomenclature-matcher-nginx:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "${{ secrets.DO_HOST }}" ] || [ -z "${{ secrets.DO_SSH_KEY }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::DO_HOST or DO_SSH_KEY secret not configured — skipping deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload deploy bundle
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "docker-compose.prod.yml,infra/alerter,infra/backup,infra/postgres,infra/redis"
          target: "/opt/1C/deploy"
          rm: true

      - name: Deploy release
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          envs: APP_IMAGE,NGINX_IMAGE
          script: |
            set -euo pipefail
            cd /opt/1C/deploy
            printf '%s' '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            export APP_IMAGE='${{ env.APP_IMAGE }}'
            export NGINX_IMAGE='${{ env.NGINX_IMAGE }}'
            docker compose -p 1c -f docker-compose.prod.yml --env-file /opt/1C/.env.production pull api worker-match worker-catalog nginx
            docker compose -p 1c -f docker-compose.prod.yml --env-file /opt/1C/.env.production up -d db redis
            docker compose -p 1c -f docker-compose.prod.yml --env-file /opt/1C/.env.production run --rm api alembic upgrade head
            docker compose -p 1c -f docker-compose.prod.yml --env-file /opt/1C/.env.production up -d backup alerter api worker-match worker-catalog nginx

      - name: Verify deployment liveness
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -euo pipefail
            for i in $(seq 1 30); do
              if curl -sf http://localhost/health >/dev/null && curl -sfk https://localhost/api/v1/health/live | grep -q '"status":"ok"'; then
                echo "Liveness check passed on attempt $i"
                exit 0
              fi
              echo "Waiting for deployment liveness... attempt $i/30"
              sleep 5
            done
            docker compose -p 1c -f /opt/1C/deploy/docker-compose.prod.yml --env-file /opt/1C/.env.production ps
            docker compose -p 1c -f /opt/1C/deploy/docker-compose.prod.yml --env-file /opt/1C/.env.production logs api worker-match worker-catalog nginx
            exit 1
