[project]
name = "matcher"
version = "0.1.0"
description = "Sales Nomenclature Matcher — cascading matching engine for 1C catalog"
readme = "README.md"
authors = [
    { name = "mindburnlabs", email = "mindburnlabs@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openai>=1.50",
    "cohere>=5.0",
    "arq>=0.26",
    "openpyxl>=3.1",
    "chardet>=5.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "psycopg2-binary>=2.9.11",
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<5",
    "defusedxml>=0.7",
    "pandas>=3.0.2",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
