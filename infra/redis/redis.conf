# Authentication — MANDATORY in production.
# Override via docker-compose: redis-server --requirepass $REDIS_PASSWORD ...
# For standalone usage, replace the placeholder below with a real secret.
# Generate: python -c "import secrets; print(secrets.token_urlsafe(32))"
requirepass CHANGE_ME_IN_PRODUCTION

maxmemory 256mb
maxmemory-policy allkeys-lru
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# Disable dangerous commands in production
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
