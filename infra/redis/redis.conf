# Authentication — MANDATORY in production.
# In production, the password is overridden via docker-compose command:
#   redis-server ... --requirepass ${REDIS_PASSWORD}
# The line below is only used when running redis-server standalone with this
# config file. The real password MUST come from .env.production.
# Generate: python -c "import secrets; print(secrets.token_urlsafe(32))"

maxmemory 256mb
maxmemory-policy allkeys-lru
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# Disable dangerous commands in production
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
